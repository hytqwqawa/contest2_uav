fence:
  forward_min: -2.0
  forward_max: 8.0
  left_min: -8.0
  left_max: 8.0
  height_min: -0.5
  height_max: 1.5
flight_height: 0.8
segment_timeout_s: 90.0
waypoint_margin: 0.2

waypoints:
  - {forward: 3.000, left: 0.000, mode: EGO, yaw_deg: 0.0} 
  - {forward: 4.000, left: -1.000, mode: EGO, yaw_deg: -135.0} 
  - {forward: 4.500, left: -1.500, mode: EGO, yaw_deg: -180.0}  
  - {forward: 4.000, left: -2.000, mode: EGO, yaw_deg: +135.0}  
  - {forward: 3.000, left: -2.000, mode: EGO, yaw_deg: -180.0}  
  - {forward: 0.500, left: -2.000, mode: EGO, yaw_deg: -180.0}  
